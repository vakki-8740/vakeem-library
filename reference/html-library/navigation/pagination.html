<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pagination</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #e5e7eb;
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    --accent: #4f6bed;
  }

  [data-theme="dark"] {
    --bg: #12141a;
    --card: #1c1f28;
    --text: #eceef3;
    --muted: #9aa1b2;
    --border: #2a2e3a;
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    --accent: #7b92ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 80px 16px 40px;
    transition: background 0.3s, color 0.3s;
  }

  .theme-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 60;
    width: 46px;
    height: 46px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.2s, background 0.3s;
  }
  .theme-toggle:hover { transform: scale(1.08); }
  .theme-toggle svg { width: 22px; height: 22px; }
  .theme-toggle .icon-sun { display: none; }
  [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
  [data-theme="dark"] .theme-toggle .icon-moon { display: none; }

  .wrap {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: var(--shadow);
    padding: 28px 24px;
    transition: background 0.3s, border-color 0.3s;
  }
  .panel > h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .panel-note { color: var(--muted); font-size: 0.85rem; }

  .section { padding: 22px 0; border-bottom: 1px solid var(--border); }
  .section:last-child { border-bottom: 0; padding-bottom: 0; }
  .section h3 { font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-bottom: 14px; }

  .pager {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }

  .page-btn,
  .page-arrow {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 38px;
    height: 38px;
    padding: 0 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.15s;
  }
  .page-btn:hover, .page-arrow:hover:not(:disabled) {
    background: var(--bg);
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
  }
  .page-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .page-btn.active:hover { background: var(--accent); color: #fff; }
  .page-arrow:disabled { opacity: 0.4; cursor: not-allowed; }
  .page-arrow svg { width: 16px; height: 16px; }
  .page-arrow.prev svg { margin-right: 2px; }
  .page-arrow.next svg { margin-left: 2px; }

  .ellipsis {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 26px;
    height: 38px;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .pager-meta {
    color: var(--muted);
    font-size: 0.82rem;
    margin-top: 12px;
  }

  .pager-info {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
  }
  .pager-info .pager-meta { margin-top: 0; }

  .pager.small .page-btn,
  .pager.small .page-arrow { min-width: 32px; height: 32px; font-size: 0.8rem; padding: 0 8px; }
  .pager.small .ellipsis { height: 32px; min-width: 20px; }

  .simple {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .simple .page-arrow { min-width: 38px; padding: 0 10px; }
  .simple-label { color: var(--muted); font-size: 0.85rem; }
  .simple-label strong { color: var(--text); font-weight: 600; }

  @media (max-width: 520px) {
    .panel { padding: 22px 18px; }
    .pager { gap: 4px; }
    .page-btn, .page-arrow { min-width: 34px; height: 34px; padding: 0 8px; font-size: 0.82rem; }
    .ellipsis { min-width: 18px; height: 34px; }
    .pager-info { align-items: flex-start; flex-direction: column; }
  }
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
</button>

<main class="wrap">
  <section class="panel">
    <h2>Pagination</h2>
    <p class="panel-note">Page navigation for lists, tables and search results.</p>

    <div class="section">
      <h3>Numbered</h3>
      <nav class="pager" id="numbered" aria-label="Pagination">
        <button class="page-arrow prev" aria-label="Previous page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button class="page-btn" data-page="1">1</button>
        <button class="page-btn active" data-page="2">2</button>
        <button class="page-btn" data-page="3">3</button>
        <button class="page-btn" data-page="4">4</button>
        <button class="page-btn" data-page="5">5</button>
        <span class="ellipsis" aria-hidden="true">…</span>
        <button class="page-btn" data-page="12">12</button>
        <button class="page-arrow next" aria-label="Next page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </nav>
      <p class="pager-meta" id="pageMeta">Page 2 of 12</p>
    </div>

    <div class="section">
      <h3>With result count</h3>
      <div class="pager-info">
        <span class="pager-meta">Showing 21–30 of 128 results</span>
        <nav class="pager small" aria-label="Pagination">
          <button class="page-arrow prev" aria-label="Previous page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <button class="page-btn" aria-label="Page 1">1</button>
          <button class="page-btn" aria-label="Page 2">2</button>
          <button class="page-btn active" aria-label="Page 3" aria-current="page">3</button>
          <button class="page-btn" aria-label="Page 4">4</button>
          <span class="ellipsis" aria-hidden="true">…</span>
          <button class="page-btn" aria-label="Page 13">13</button>
          <button class="page-arrow next" aria-label="Next page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </nav>
      </div>
    </div>

    <div class="section">
      <h3>Simple prev / next</h3>
      <div class="simple">
        <button class="page-arrow prev" aria-label="Previous page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
          Prev
        </button>
        <span class="simple-label">Page <strong>3</strong> of 12</span>
        <button class="page-arrow next" aria-label="Next page">
          Next
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
    </div>
  </section>
</main>

<script>
  const root = document.documentElement;
  const toggle = document.getElementById("themeToggle");

  function setTheme(theme) {
    root.setAttribute("data-theme", theme);
    try { localStorage.setItem("theme", theme); } catch (e) {}
  }

  let saved = null;
  try { saved = localStorage.getItem("theme"); } catch (e) {}
  setTheme(saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

  toggle.addEventListener("click", () => {
    setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });

  const numbered = document.getElementById("numbered");
  const meta = document.getElementById("pageMeta");
  let current = 2;

  function render() {
    numbered.querySelectorAll(".page-btn").forEach(btn => {
      const isActive = Number(btn.dataset.page) === current;
      btn.classList.toggle("active", isActive);
      if (isActive) btn.setAttribute("aria-current", "page");
      else btn.removeAttribute("aria-current");
    });
    meta.textContent = "Page " + current + " of 12";
  }

  numbered.querySelectorAll(".page-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      current = Number(btn.dataset.page);
      render();
    });
  });

  numbered.querySelector(".prev").addEventListener("click", () => {
    if (current > 1) { current--; render(); }
  });
  numbered.querySelector(".next").addEventListener("click", () => {
    if (current < 12) { current++; render(); }
  });
</script>
</body>
</html>
