<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Floating Action Button</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #e5e7eb;
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    --accent: #4f6bed;
    --yes: #22a06b;
    --no: #e5484d;
    --accent-soft: rgba(79, 107, 237, 0.10);
  }

  [data-theme="dark"] {
    --bg: #12141a;
    --card: #1c1f28;
    --text: #eceef3;
    --muted: #9aa1b2;
    --border: #2a2e3a;
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    --accent: #7b92ff;
    --accent-soft: rgba(123, 146, 255, 0.14);
    --fab-shadow: 0 12px 26px rgba(79, 107, 237, 0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 80px 16px 40px;
    transition: background 0.3s, color 0.3s;
  }

  .theme-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 60;
    width: 46px;
    height: 46px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.2s, background 0.3s;
  }
  .theme-toggle:hover { transform: scale(1.08); }
  .theme-toggle svg { width: 22px; height: 22px; }
  .theme-toggle .icon-sun { display: none; }
  [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
  [data-theme="dark"] .theme-toggle .icon-moon { display: none; }

  .wrap {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: var(--shadow);
    padding: 24px;
    transition: background 0.3s, border-color 0.3s;
  }
  .panel h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .panel-note { color: var(--muted); font-size: 0.85rem; margin-bottom: 18px; }

  /* ---------- Stage ---------- */
  .stage {
    position: relative;
    min-height: 310px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 20px;
    overflow: hidden;
  }
  .stage h3 { font-size: 1rem; margin-bottom: 4px; }
  .stage > p { color: var(--muted); font-size: 0.82rem; margin-bottom: 14px; }

  .mock-list { display: flex; flex-direction: column; gap: 8px; }
  .mock-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    max-width: 420px;
  }
  .mock-row .dot {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }
  .mock-row .dot svg { width: 14px; height: 14px; }
  .mock-row .lines { flex: 1; }
  .mock-row .lines b { display: block; width: 52%; height: 5px; border-radius: 3px; background: var(--border); }
  .mock-row .lines i { display: block; width: 34%; height: 4px; border-radius: 3px; background: var(--border); margin-top: 5px; opacity: 0.7; }
  .mock-row .pill {
    font-size: 0.62rem;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 3px 8px;
  }

  /* ---------- FAB ---------- */
  .fab {
    position: absolute;
    right: 22px;
    bottom: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 56px;
    height: 56px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(79, 107, 237, 0.32);
    transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
  }
  .fab:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 14px 30px rgba(79, 107, 237, 0.4); }
  .fab:active { transform: translateY(0) scale(0.98); }
  .fab svg { width: 24px; height: 24px; }

  .fab.extended {
    width: auto;
    padding: 0 20px 0 16px;
    border-radius: 999px;
  }
  .fab.extended svg { width: 20px; height: 20px; }

  .fab.success { background: var(--yes); box-shadow: 0 10px 24px rgba(34, 160, 107, 0.32); }
  .fab.success:hover { box-shadow: 0 14px 30px rgba(34, 160, 107, 0.4); }
  .fab.outline {
    background: var(--card);
    border-color: var(--border);
    color: var(--accent);
    box-shadow: var(--shadow);
  }
  .fab.outline:hover { border-color: var(--accent); box-shadow: var(--shadow); }
  .fab.mini { width: 42px; height: 42px; }
  .fab.mini svg { width: 18px; height: 18px; }
  .fab.large { width: 66px; height: 66px; }
  .fab.large svg { width: 28px; height: 28px; }

  .toast {
    position: absolute;
    left: 50%;
    bottom: 26px;
    transform: translate(-50%, 10px);
    background: var(--text);
    color: var(--bg);
    font-size: 0.78rem;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 6px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s, transform 0.2s, visibility 0.2s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }

  /* ---------- Variant grid ---------- */
  .variants {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px;
  }
  .variant {
    position: relative;
    min-height: 120px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 12px 30px;
  }
  .variant .fab { position: static; }
  .variant-label {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 9px;
    text-align: center;
    font-size: 0.72rem;
    color: var(--muted);
  }

  @media (max-width: 560px) {
    .panel { padding: 18px; }
    .stage { min-height: 280px; padding: 16px; }
    .mock-row { max-width: none; }
    .toast { bottom: 92px; }
    .fab.extended span { display: none; }
    .fab.extended { padding: 0; width: 56px; }
  }
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
</button>

<main class="wrap">

  <section class="panel">
    <h2>Floating action button</h2>
    <p class="panel-note">The primary action stays pinned to the bottom-right of the content area.</p>

    <div class="stage">
      <h3>Projects</h3>
      <p>3 active this week</p>

      <div class="mock-list">
        <div class="mock-row">
          <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
          <span class="lines"><b></b><i></i></span>
          <span class="pill">Active</span>
        </div>
        <div class="mock-row">
          <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
          <span class="lines"><b></b><i></i></span>
          <span class="pill">Review</span>
        </div>
        <div class="mock-row">
          <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
          <span class="lines"><b></b><i></i></span>
          <span class="pill">Active</span>
        </div>
      </div>

      <button class="fab" id="mainFab" aria-label="Create new project">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <div class="toast" id="toast">New project created</div>
    </div>
  </section>

  <section class="panel">
    <h2>Variants &amp; sizes</h2>
    <div class="variants">
      <div class="variant">
        <button class="fab" aria-label="Add">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <span class="variant-label">Default</span>
      </div>

      <div class="variant">
        <button class="fab success" aria-label="Approve">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
        </button>
        <span class="variant-label">Success</span>
      </div>

      <div class="variant">
        <button class="fab outline" aria-label="Edit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        </button>
        <span class="variant-label">Outline</span>
      </div>

      <div class="variant">
        <button class="fab mini" aria-label="Add small">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <span class="variant-label">Mini</span>
      </div>

      <div class="variant">
        <button class="fab large" aria-label="Start">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <span class="variant-label">Large</span>
      </div>

      <div class="variant">
        <button class="fab extended" aria-label="Create new">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>Create</span>
        </button>
        <span class="variant-label">Extended</span>
      </div>
    </div>
  </section>

</main>

<script>
  const root = document.documentElement;
  const toggle = document.getElementById("themeToggle");

  function setTheme(theme) {
    root.setAttribute("data-theme", theme);
    try { localStorage.setItem("theme", theme); } catch (e) {}
  }

  let saved = null;
  try { saved = localStorage.getItem("theme"); } catch (e) {}
  setTheme(saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

  toggle.addEventListener("click", () => {
    setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });

  const toast = document.getElementById("toast");
  let toastTimer = null;

  document.getElementById("mainFab").addEventListener("click", () => {
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 1600);
  });
</script>
</body>
</html>
