<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tooltips</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #e5e7eb;
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    --accent: #4f6bed;
    --accent-soft: rgba(79, 107, 237, 0.10);
  }

  [data-theme="dark"] {
    --bg: #12141a;
    --card: #1c1f28;
    --text: #eceef3;
    --muted: #9aa1b2;
    --border: #2a2e3a;
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    --accent: #7b92ff;
    --accent-soft: rgba(123, 146, 255, 0.14);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 80px 16px 40px;
    transition: background 0.3s, color 0.3s;
  }

  .theme-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 60;
    width: 46px;
    height: 46px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.2s, background 0.3s;
  }
  .theme-toggle:hover { transform: scale(1.08); }
  .theme-toggle svg { width: 22px; height: 22px; }
  .theme-toggle .icon-sun { display: none; }
  [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
  [data-theme="dark"] .theme-toggle .icon-moon { display: none; }

  .wrap {
    width: 100%;
    max-width: 840px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: var(--shadow);
    padding: 24px;
    transition: background 0.3s, border-color 0.3s;
  }
  .panel h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .panel-note { color: var(--muted); font-size: 0.85rem; margin-bottom: 18px; }

  .tip-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .demo-box {
    position: relative;
    min-height: 130px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 24px 16px;
  }
  .demo-box .label { font-size: 0.72rem; color: var(--muted); }

  /* ---------- Tooltip ---------- */
  .tip {
    position: relative;
    display: inline-flex;
  }
  .tip::after {
    content: attr(data-tip);
    position: absolute;
    z-index: 20;
    background: var(--text);
    color: var(--bg);
    font-size: 0.72rem;
    font-weight: 500;
    line-height: 1.4;
    padding: 6px 9px;
    border-radius: 6px;
    white-space: nowrap;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.15s, visibility 0.15s;
    pointer-events: none;
  }
  .tip::before {
    content: "";
    position: absolute;
    z-index: 20;
    width: 0;
    height: 0;
    border: 5px solid transparent;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.15s, visibility 0.15s;
    pointer-events: none;
  }

  .tip:hover::after,
  .tip:hover::before,
  .tip:focus-within::after,
  .tip:focus-within::before {
    opacity: 1;
    visibility: visible;
  }

  /* Top */
  .tip[data-pos="top"]::after { bottom: calc(100% + 9px); left: 50%; transform: translateX(-50%); }
  .tip[data-pos="top"]::before {
    bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%);
    border-top-color: var(--text); border-bottom-width: 0;
  }

  /* Bottom */
  .tip[data-pos="bottom"]::after { top: calc(100% + 9px); left: 50%; transform: translateX(-50%); }
  .tip[data-pos="bottom"]::before {
    top: calc(100% + 4px); left: 50%; transform: translateX(-50%);
    border-bottom-color: var(--text); border-top-width: 0;
  }

  /* Left */
  .tip[data-pos="left"]::after { right: calc(100% + 9px); top: 50%; transform: translateY(-50%); }
  .tip[data-pos="left"]::before {
    right: calc(100% + 4px); top: 50%; transform: translateY(-50%);
    border-left-color: var(--text); border-right-width: 0;
  }

  /* Right */
  .tip[data-pos="right"]::after { left: calc(100% + 9px); top: 50%; transform: translateY(-50%); }
  .tip[data-pos="right"]::before {
    left: calc(100% + 4px); top: 50%; transform: translateY(-50%);
    border-right-color: var(--text); border-left-width: 0;
  }

  /* ---------- Buttons ---------- */
  .icon-btn {
    width: 42px;
    height: 42px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, transform 0.15s;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .icon-btn svg { width: 19px; height: 19px; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-family: inherit;
    font-size: 0.86rem;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn svg { width: 16px; height: 16px; }

  .key {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 18px;
    height: 16px;
    padding: 0 4px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.16);
    font-size: 0.62rem;
    font-weight: 700;
  }

  /* ---------- Inline example ---------- */
  .inline-row {
    display: flex;
    align-items: center;
    gap: 22px;
    flex-wrap: wrap;
    padding: 8px 0;
  }
  .inline-note {
    font-size: 0.86rem;
    color: var(--muted);
    line-height: 1.6;
    max-width: 520px;
  }
  .dotted {
    border-bottom: 1px dashed var(--accent);
    color: var(--text);
    cursor: help;
  }

  @media (max-width: 560px) {
    .panel { padding: 18px; }
    .tip-grid { grid-template-columns: 1fr; }
    .demo-box { min-height: 116px; }
    .tip::after { font-size: 0.7rem; }
  }
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
</button>

<main class="wrap">

  <section class="panel">
    <h2>Tooltip positions</h2>
    <p class="panel-note">Hover or focus a button to reveal its label. Tap works on touch screens.</p>

    <div class="tip-grid">
      <div class="demo-box">
        <span class="tip" data-pos="top" data-tip="Add a new project">
          <button class="icon-btn" aria-label="Add a new project">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </span>
        <span class="label">Top</span>
      </div>

      <div class="demo-box">
        <span class="tip" data-pos="right" data-tip="Search (Ctrl + K)">
          <button class="icon-btn" aria-label="Search, shortcut Control K">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
          </button>
        </span>
        <span class="label">Right</span>
      </div>

      <div class="demo-box">
        <span class="tip" data-pos="left" data-tip="Settings">
          <button class="icon-btn" aria-label="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </span>
        <span class="label">Left</span>
      </div>

      <div class="demo-box">
        <span class="tip" data-pos="bottom" data-tip="Delete permanently">
          <button class="icon-btn" aria-label="Delete permanently">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/></svg>
          </button>
        </span>
        <span class="label">Bottom</span>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>In context</h2>
    <p class="panel-note">Use tooltips for short hints, never for essential information.</p>

    <div class="inline-row">
      <span class="tip" data-pos="top" data-tip="Save changes (Ctrl + S)">
        <button class="btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
          Save
          <span class="key">⌘S</span>
        </button>
      </span>

      <span class="tip" data-pos="top" data-tip="Shared with 4 people">
        <button class="btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>
          Share
        </button>
      </span>
    </div>

    <p class="inline-note" style="margin-top: 16px;">
      Hover the
      <span class="tip" data-pos="top" data-tip="Opens in a new tab">
        <span class="dotted">dotted text</span>
      </span>
      to see a tooltip attached to inline content instead of a button.
    </p>
  </section>

</main>

<script>
  const root = document.documentElement;
  const toggle = document.getElementById("themeToggle");

  function setTheme(theme) {
    root.setAttribute("data-theme", theme);
    try { localStorage.setItem("theme", theme); } catch (e) {}
  }

  let saved = null;
  try { saved = localStorage.getItem("theme"); } catch (e) {}
  setTheme(saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

  toggle.addEventListener("click", () => {
    setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });
</script>
</body>
</html>
