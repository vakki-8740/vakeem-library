<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Buttons</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1f2430;--muted:#6b7280;--border:#e5e7eb;--shadow:0 8px 30px rgba(0,0,0,.08);--accent:#4f6bed;--yes:#22a06b;--no:#e5484d}
[data-theme="dark"]{--bg:#12141a;--card:#1c1f28;--text:#eceef3;--muted:#9aa1b2;--border:#2a2e3a;--shadow:0 8px 30px rgba(0,0,0,.4);--accent:#7b92ff}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:80px 16px 40px;transition:background .3s,color .3s}
.theme-toggle{position:fixed;top:16px;right:16px;width:46px;height:46px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow);transition:transform .2s,background .3s}
.theme-toggle:hover{transform:scale(1.08)}
.theme-toggle svg{width:22px;height:22px}
.theme-toggle .icon-sun{display:none}
[data-theme="dark"] .theme-toggle .icon-sun{display:block}
[data-theme="dark"] .theme-toggle .icon-moon{display:none}

.card{width:100%;max-width:520px;background:var(--card);border:1px solid var(--border);border-radius:6px;box-shadow:var(--shadow);padding:28px 24px;transition:background .3s,border-color .3s}
.card h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.row + h2{margin-top:24px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 20px;border-radius:6px;font-size:.95rem;font-weight:600;line-height:1;cursor:pointer;border:1px solid transparent;transition:transform .15s,opacity .2s,background .2s,border-color .2s,color .2s}
.btn svg{width:16px;height:16px;flex:0 0 auto}
.btn:hover:not(:disabled){transform:translateY(-2px);opacity:.92}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.loading{opacity:.8;cursor:progress}
.primary{background:var(--accent);color:#fff}
.secondary{background:var(--bg);border-color:var(--border);color:var(--text)}
.secondary:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.success{background:var(--yes);color:#fff}
.danger{background:var(--no);color:#fff}
.outline{background:transparent;border-color:var(--border);color:var(--text)}
.outline:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.ghost{background:transparent;color:var(--accent)}
.ghost:hover:not(:disabled){background:var(--bg)}
.sm{padding:6px 14px;font-size:.82rem}
.lg{padding:14px 28px;font-size:1.05rem}
.full{width:100%}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
<svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
<svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
</button>

<div class="card">
<h2>Variants</h2>
<div class="row">
<button class="btn primary">Primary</button>
<button class="btn success">Success</button>
<button class="btn danger">Danger</button>
<button class="btn secondary">Secondary</button>
<button class="btn outline">Outline</button>
<button class="btn ghost">Ghost</button>
</div>

<h2>Sizes</h2>
<div class="row">
<button class="btn primary sm">Small</button>
<button class="btn primary">Medium</button>
<button class="btn primary lg">Large</button>
</div>

<h2>Disabled</h2>
<div class="row">
<button class="btn primary" disabled>Primary</button>
<button class="btn outline" disabled>Outline</button>
</div>

<h2>With icons</h2>
<div class="row">
<button class="btn primary">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
Download
</button>
<button class="btn outline">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
Add item
</button>
<button class="btn ghost">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.6l6.8-3.9M8.6 13.4l6.8 3.9"/></svg>
Share
</button>
</div>

<h2>Full width</h2>
<div class="row">
<button class="btn primary full">
Continue to checkout
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
</button>
</div>

<h2>Loading</h2>
<div class="row">
<button class="btn primary loading" disabled><span class="spin" aria-hidden="true"></span>Saving...</button>
<button class="btn outline loading" disabled><span class="spin" aria-hidden="true"></span>Please wait</button>
</div>
</div>

<script>
const root=document.documentElement,toggle=document.getElementById("themeToggle");
function setTheme(t){root.setAttribute("data-theme",t);try{localStorage.setItem("theme",t)}catch(e){}}
let saved=null;try{saved=localStorage.getItem("theme")}catch(e){}
setTheme(saved||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
toggle.addEventListener("click",()=>setTheme(root.getAttribute("data-theme")==="dark"?"light":"dark"));
</script>
</body>
</html>
