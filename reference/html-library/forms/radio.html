<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Radio Buttons</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #e5e7eb;
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    --accent: #4f6bed;
    --yes: #22a06b;
    --no: #e5484d;
    --accent-soft: rgba(79, 107, 237, 0.10);
  }

  [data-theme="dark"] {
    --bg: #12141a;
    --card: #1c1f28;
    --text: #eceef3;
    --muted: #9aa1b2;
    --border: #2a2e3a;
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    --accent: #7b92ff;
    --accent-soft: rgba(123, 146, 255, 0.14);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 80px 16px 40px;
    transition: background 0.3s, color 0.3s;
  }

  .theme-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 60;
    width: 46px;
    height: 46px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.2s, background 0.3s;
  }
  .theme-toggle:hover { transform: scale(1.08); }
  .theme-toggle svg { width: 22px; height: 22px; }
  .theme-toggle .icon-sun { display: none; }
  [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
  [data-theme="dark"] .theme-toggle .icon-moon { display: none; }

  .wrap {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: var(--shadow);
    padding: 24px;
    transition: background 0.3s, border-color 0.3s;
  }
  .panel h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .panel-note { color: var(--muted); font-size: 0.85rem; margin-bottom: 18px; }

  /* ---------- Radio ---------- */
  .radio {
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 0.9rem;
    line-height: 1.45;
    cursor: pointer;
    user-select: none;
  }
  .radio input {
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
    pointer-events: none;
  }

  .dot {
    width: 18px;
    height: 18px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    margin-top: 1px;
    transition: background 0.18s, border-color 0.18s, box-shadow 0.18s;
  }
  .dot::after {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: #fff;
    transform: scale(0);
    transition: transform 0.15s;
  }

  .radio:hover .dot { border-color: var(--accent); }
  .radio input:focus-visible + .dot { box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent); }
  .radio input:checked + .dot { background: var(--accent); border-color: var(--accent); }
  .radio input:checked + .dot::after { transform: scale(1); }

  .radio input:disabled + .dot { background: var(--bg); border-color: var(--border); }
  .radio input:disabled:checked + .dot { background: var(--muted); border-color: var(--muted); }
  .radio.disabled { color: var(--muted); cursor: not-allowed; }
  .radio.disabled:hover .dot { border-color: var(--border); }
  .radio.disabled input:disabled:checked + .dot { border-color: var(--muted); }

  .radio-text strong { display: block; font-weight: 600; font-size: 0.9rem; }
  .radio-text span { display: block; color: var(--muted); font-size: 0.78rem; margin-top: 2px; }

  /* ---------- States ---------- */
  .states {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
    gap: 16px;
  }
  .state {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    padding: 14px;
  }
  .state-label {
    display: block;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 10px;
  }

  /* ---------- Card radio group ---------- */
  .radio-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 12px;
  }
  .radio-card {
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 11px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card);
    padding: 15px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .radio-card:hover { border-color: var(--accent); }
  .radio-card:has(input:checked) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .radio-card input {
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
    pointer-events: none;
  }
  .radio-card input:focus-visible + .dot { box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent); }
  .radio-card .radio-text span { line-height: 1.45; }

  .radio-text .tag {
    display: inline-flex;
    align-items: center;
    margin-top: 8px;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: 0.62rem;
    font-weight: 700;
  }

  .divider { height: 1px; background: var(--border); margin: 22px 0; }
  .sub-title { font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-bottom: 12px; }

  /* ---------- Inline ---------- */
  .inline-radios { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .inline-radios .radio { font-size: 0.86rem; }

  @media (max-width: 600px) {
    .panel { padding: 18px; }
    .states { grid-template-columns: 1fr 1fr; gap: 10px; }
    .radio-cards { grid-template-columns: 1fr; }
  }
  @media (max-width: 400px) {
    .states { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
</button>

<main class="wrap">

  <section class="panel">
    <h2>Radio states</h2>
    <p class="panel-note">Only one option can be selected inside a group with the same name.</p>

    <div class="states">
      <div class="state">
        <span class="state-label">Default</span>
        <label class="radio">
          <input type="radio" name="demo1" />
          <span class="dot"></span>
          Standard shipping
        </label>
      </div>

      <div class="state">
        <span class="state-label">Selected</span>
        <label class="radio">
          <input type="radio" name="demo1" checked />
          <span class="dot"></span>
          Express shipping
        </label>
      </div>

      <div class="state">
        <span class="state-label">Disabled</span>
        <label class="radio disabled">
          <input type="radio" name="demo2" disabled />
          <span class="dot"></span>
          Not available
        </label>
      </div>

      <div class="state">
        <span class="state-label">Disabled + selected</span>
        <label class="radio disabled">
          <input type="radio" name="demo3" checked disabled />
          <span class="dot"></span>
          Locked choice
        </label>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>Radio group · cards</h2>
    <p class="panel-note">Larger targets with a description and an optional recommendation tag.</p>

    <div class="radio-cards">
      <label class="radio-card">
        <input type="radio" name="plan" value="starter" />
        <span class="dot"></span>
        <span class="radio-text">
          <strong>Starter</strong>
          <span>For personal projects. 1 workspace, 3 projects.</span>
          <span class="tag" style="background: var(--accent-soft); color: var(--accent);">Free</span>
        </span>
      </label>

      <label class="radio-card">
        <input type="radio" name="plan" value="pro" checked />
        <span class="dot"></span>
        <span class="radio-text">
          <strong>Pro</strong>
          <span>For freelancers. Unlimited projects and exports.</span>
          <span class="tag">Most popular</span>
        </span>
      </label>

      <label class="radio-card">
        <input type="radio" name="plan" value="team" />
        <span class="dot"></span>
        <span class="radio-text">
          <strong>Team</strong>
          <span>Shared workspaces, roles and review tools.</span>
          <span class="tag" style="background: var(--accent-soft); color: var(--accent);">$12 / seat</span>
        </span>
      </label>
    </div>

    <div class="divider"></div>

    <p class="sub-title">Inline group</p>
    <div class="inline-radios">
      <span style="font-size: 0.82rem; color: var(--muted);">Size:</span>
      <label class="radio"><input type="radio" name="size" /><span class="dot"></span>Small</label>
      <label class="radio"><input type="radio" name="size" checked /><span class="dot"></span>Medium</label>
      <label class="radio"><input type="radio" name="size" /><span class="dot"></span>Large</label>
    </div>
  </section>

</main>

<script>
  const root = document.documentElement;
  const toggle = document.getElementById("themeToggle");

  function setTheme(theme) {
    root.setAttribute("data-theme", theme);
    try { localStorage.setItem("theme", theme); } catch (e) {}
  }

  let saved = null;
  try { saved = localStorage.getItem("theme"); } catch (e) {}
  setTheme(saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

  toggle.addEventListener("click", () => {
    setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });
</script>
</body>
</html>
