<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{TITLE}} · OWN Library</title>
<script>
try {
  var vt = localStorage.getItem("theme");
  if (vt) { document.documentElement.setAttribute("data-theme", vt); }
  else if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) { document.documentElement.setAttribute("data-theme", "dark"); }
} catch (e) {}
</script>
<link rel="stylesheet" href="../lib/viewer.css" />
</head>
<body>
<header class="vw-topbar">
  <a class="vw-back" href="../index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    OWN Library
  </a>
  <span class="vw-cat">{{CAT}}</span>
  <span class="vw-spacer"></span>
  <button class="vw-theme" id="vwTheme" type="button" aria-label="Toggle theme">
    <svg class="vw-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="vw-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  </button>
</header>
<main class="vw-page">
  <div class="vw-head">
    <h1>{{TITLE}}</h1>
    <p>{{DESC}}</p>
  </div>
{{BLOCKS}}
  <footer class="vw-foot">
    Copy kiya gaya code standalone hota hai — usme library ka viewer chrome shamil nahi. Agar code me <code>var(--…)</code> use hua hai to <b>Tokens</b> tab wale CSS variables bhi project me add karein.
  </footer>
</main>
<script src="../lib/viewer.js"></script>
</body>
</html>
